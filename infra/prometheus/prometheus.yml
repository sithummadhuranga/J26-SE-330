global:
  scrape_interval: 5s

scrape_configs:
  # Every service's metrics, via the OpenTelemetry collector (plan phase 11).
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  # Kafka consumer-group lag per topic and partition (§13: "consumer lag rises then drains").
  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]
