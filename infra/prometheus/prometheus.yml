global:
  scrape_interval: 5s

scrape_configs:
  # Every service's metrics, collected through the OpenTelemetry collector (plan phase 11).
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  # Kafka consumer-group lag for each topic and partition, to show that "consumer lag rises then drains" (§13).
  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]
