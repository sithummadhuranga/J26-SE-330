server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # The app is static; everything it needs from the backend goes to the API gateway (ADR 0004).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # Built files carry a content hash in their name, so they never change: cache them for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        try_files $uri =404;
    }

    # Everything else (index.html and client-side routes like /devices) always revalidates, so a new release is picked up.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        try_files $uri $uri/ /index.html;
    }
}
